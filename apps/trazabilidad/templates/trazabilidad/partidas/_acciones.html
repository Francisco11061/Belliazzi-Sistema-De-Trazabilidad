<div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap">
{% if partida.situacion == 'DISPONIBLE' %}
    <a href="{% url 'trazabilidad:procesar_partida' partida.pk %}" class="inline-flex items-center justify-center rounded-lg bg-cyan-700 px-5 py-3 text-sm font-semibold text-white hover:bg-cyan-800 focus-visible:outline-2 focus-visible:outline-cyan-600">Enviar a proceso</a>
    <a href="{% url 'trazabilidad:enviar_partida_mantencion' partida.pk %}" class="inline-flex items-center justify-center rounded-lg border border-cyan-700 bg-white px-5 py-3 text-sm font-semibold text-cyan-700 hover:bg-cyan-50 focus-visible:outline-2 focus-visible:outline-cyan-600">Enviar a cámara</a>
{% elif partida.situacion == 'EN_MANTENCION' %}
    <a href="{% url 'trazabilidad:retirar_partida_mantencion' partida.pk %}" class="inline-flex items-center justify-center rounded-lg bg-cyan-700 px-5 py-3 text-sm font-semibold text-white hover:bg-cyan-800 focus-visible:outline-2 focus-visible:outline-cyan-600">Retirar de cámara</a>
{% elif partida.situacion == 'EN_PROCESO' %}
    <p class="rounded-lg border border-cyan-100 bg-cyan-50 px-4 py-3 text-sm text-cyan-800">Esta partida ya ingresó a procesamiento.</p>
{% endif %}
</div>
