<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Pesquera Belliazzi</title>
</head>
<body>
    <main>
        <h1>Sistema de Trazabilidad e Inventario</h1>
        <p>Pesquera Belliazzi</p>
        <form method="post" action="{% url 'usuarios:login' %}">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <p>
                <label for="{{ form.username.id_for_label }}">Usuario</label>
                {{ form.username }}
                {{ form.username.errors }}
            </p>
            <p>
                <label for="{{ form.password.id_for_label }}">Contraseña</label>
                {{ form.password }}
                {{ form.password.errors }}
            </p>
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <button type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
