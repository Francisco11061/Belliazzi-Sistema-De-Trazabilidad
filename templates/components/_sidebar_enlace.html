<a href="{% url destino %}" {% if activo %}aria-current="page"{% endif %} class="flex min-h-11 w-full items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-700 {% if activo %}bg-cyan-50 text-cyan-800{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
    {% include 'components/_sidebar_icono.html' %}
    <span class="min-w-0 flex-1 leading-5 [overflow-wrap:anywhere]">{{ nombre }}</span>
    {% if pendientes %}<span class="shrink-0 rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-700">{{ pendientes }}<span class="sr-only"> solicitudes pendientes</span></span>{% endif %}
</a>
